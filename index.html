<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Official website for Alibaba Security VELLDEPTH and its CyberGym Agent Track and Model Track writeups."
    />
    <title>Alibaba Security VELLDEPTH</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #07111f;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 20% 20%, rgba(33, 150, 243, 0.2), transparent 35%),
          radial-gradient(circle at 80% 70%, rgba(0, 229, 255, 0.14), transparent 35%),
          #07111f;
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
      }

      main {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
      }

      .hero {
        width: min(760px, 100%);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 24px;
        color: #67e8f9;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22d3ee;
        box-shadow: 0 0 18px #22d3ee;
        content: "";
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-weight: 750;
        letter-spacing: -0.055em;
        line-height: 0.92;
      }

      h1 .line-brand {
        display: block;
        color: #f8fafc;
        font-size: clamp(2.1rem, 7vw, 4.9rem);
        letter-spacing: -0.045em;
        white-space: nowrap;
      }

      h1 .line-name {
        display: block;
        color: transparent;
        background: linear-gradient(90deg, #38bdf8, #67e8f9 55%, #a5f3fc);
        background-clip: text;
        -webkit-background-clip: text;
        font-size: clamp(3rem, 10.6vw, 7.4rem);
        letter-spacing: -0.06em;
      }

      .description {
        max-width: 560px;
        margin: 32px 0;
        color: #a8b6c8;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.75;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 46px;
        padding: 0 20px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 999px;
        color: #e2e8f0;
        font-size: 0.92rem;
        font-weight: 650;
        text-decoration: none;
        transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
      }

      .actions a:first-child {
        border-color: #22d3ee;
        background: #22d3ee;
        color: #07111f;
      }

      a:hover {
        border-color: #67e8f9;
        background: rgba(103, 232, 249, 0.08);
        transform: translateY(-2px);
      }

      .actions a:first-child:hover {
        background: #67e8f9;
      }

      footer {
        position: fixed;
        right: 24px;
        bottom: 20px;
        color: #526176;
        font-size: 0.78rem;
      }

      @media (max-width: 560px) {
        main {
          align-items: center;
          padding: 24px;
        }

        h1 .line-brand {
          white-space: normal;
        }

        footer {
          display: none;
        }

      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="site-title">
        <p class="eyebrow">Official website</p>
        <h1 id="site-title"><span class="line-brand">Alibaba Security</span><span class="line-name">VELLDEPTH</span></h1>
        <p class="description">
        </p>
        <nav class="actions" aria-label="Project links">
          <a href="writeups/model-track.html">CyberGym Model Track</a>
          <a href="writeups/agent-track.html">CyberGym Agent Track</a>
          <a href="https://github.com/Alibaba-VELLDEPTH">View on GitHub</a>
          <a href="https://github.com/Alibaba-VELLDEPTH/MetaVideoAgent">MetaVideoAgent</a>
        </nav>
      </section>
    </main>
    <footer>Alibaba Security VELLDEPTH</footer>
  </body>
</html>
